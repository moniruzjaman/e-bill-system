<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Offline — E-Bill System</title>
<meta name="theme-color" content="#006A4E"/>
<link rel="icon" href="/favicon.png" type="image/png"/>
<style>
  :root { color-scheme: light; }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100dvh; display: flex; align-items: center; justify-content: center;
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    background: linear-gradient(160deg, #e9f4f0 0%, #faf9f5 55%, #fdecEE 100%);
    color: #004230; padding: 1.5rem; text-align: center;
  }
  .card {
    max-width: 26rem; background: #ffffff; border: 1px solid rgba(0,106,78,.15);
    border-radius: 1.25rem; padding: 2.5rem 2rem; box-shadow: 0 18px 45px rgba(0,66,48,.10);
  }
  .mark { width: 72px; height: 72px; margin: 0 auto 1rem; border-radius: 999px;
    background: #006A4E; display: flex; align-items: center; justify-content: center; }
  .mark span { width: 26px; height: 26px; border-radius: 999px; background: #F42A41; display: block; }
  h1 { font-size: 1.35rem; margin: 0 0 .5rem; }
  p { color: #4b6b5e; line-height: 1.6; margin: 0 0 1.5rem; font-size: .95rem; }
  a.btn {
    display: inline-block; background: #006A4E; color: #fff; text-decoration: none;
    padding: .7rem 1.4rem; border-radius: .6rem; font-weight: 600; font-size: .95rem;
  }
  a.btn:hover { background: #004d39; }
  .hint { margin-top: 1rem; font-size: .78rem; color: #7a827c; }
</style>
</head>
<body>
  <main class="card">
    <div class="mark"><span></span></div>
    <h1>You are offline</h1>
    <p>This page has not been cached yet. Reports you have already opened stay available offline — reconnect and open them once to pin them.</p>
    <a class="btn" href="/">Try again</a>
    <p class="hint">E-Bill System — Fertilizer Policy Reports</p>
  </main>
</body>
</html>
